[project]
name = "light-llm"
version = "0.1.0"
description = "LLM cross-cutting layer — OpenAI-compatible client, retry, JSON extraction, parallelism, prompts, usage tracking"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
