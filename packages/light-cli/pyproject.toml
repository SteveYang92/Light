[project]
name = "light-cli"
version = "0.1.0"
description = "ASR → translation → subtitle pipeline"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "light-models",
    "light-core",
    "light-llm",
    "light-text",
    "light-asr",
    "light-asr-polish",
    "light-subtitle",
    "typer>=0.15",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "openai>=1.0",
    "yt-dlp>=2024.0",
]

[tool.uv.sources]
light-models = { workspace = true }
light-core = { workspace = true }
light-llm = { workspace = true }
light-text = { workspace = true }
light-asr = { workspace = true }
light-asr-polish = { workspace = true }
light-subtitle = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
light = "light_cli.main:light_app"
light-subtitle = "light_cli.main:app"
