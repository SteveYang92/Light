[project]
name = "light-asr-polish"
version = "0.1.0"
description = "LLM-based ASR post-processing — transcript correction and punctuation restoration"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "light-models",
    "light-text",
    "light-core",
    "light-llm",
]

[tool.uv.sources]
light-models = { workspace = true }
light-text = { workspace = true }
light-core = { workspace = true }
light-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
