[project]
name = "light-eval"
version = "0.1.0"
description = "Subtitle self-improvement evaluation framework — case suites, runners, and judges"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "light-models",
    "light-text",
    "light-core",
    "light-llm",
    "light-subtitle",
    "typer>=0.15",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv.sources]
light-models = { workspace = true }
light-text = { workspace = true }
light-core = { workspace = true }
light-llm = { workspace = true }
light-subtitle = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
light-eval = "light_eval.cli:app"
