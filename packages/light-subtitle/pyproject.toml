[project]
name = "light-subtitle"
version = "0.1.0"
description = "Subtitle capability package — segmentation, line-breaking, styling, and export"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "light-models",
    "light-text",
    "light-core",
    "light-llm",
    "jieba>=0.42",
    "pyyaml>=6.0",
]

[tool.uv.sources]
light-models = { workspace = true }
light-text = { workspace = true }
light-core = { workspace = true }
light-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
