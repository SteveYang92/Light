[project]
name = "light-tts"
version = "0.1.0"
description = "Subtitle dubbing via Qwen3-TTS (mlx-audio) or official IndexTTS2 voice cloning"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.15",
]

[project.optional-dependencies]
mlx = ["mlx-audio"]

[project.scripts]
light-tts = "light_tts.main:app"

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/light_tts"]
